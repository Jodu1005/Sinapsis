            - generic "Agent 实时输出" [ref=e371]: "The \"pi agent\" appears to be a Runtime adapter in this project. Let me explore the runtime adapter structure and the pi adapter specifically.The task is to research the Pi agent's implementation and extension in this codebase, and output a report. Let me dig into the runtime adapter, its ports, profiles, and tests.The `pi` binary is the `@earendil-works/pi-coding-agent` npm package. Let me inspect it and research the upstream project.Local reads outside the worktree are blocked. I'll research the pi-coding-agent upstream project via the web instead.Web access isn't available in this session, so I'll base the report on the codebase itself — which contains the full integration. Let me read the remaining wiring: the plan docs, process-runner port, and how the coordinator consumes the runtime.Now let me examine how the coordinator drives Pi sessions (persistence, recovery, conversation turns) and the schema.I now have a complete picture. Let me write the report.The report is written. Let me verify the claims by running the Pi adapter tests, then commit.Tests require approval to run — I'll skip execution; the report's claims are all directly verified against the source. Let me commit the report.Git operations require approval in this session, so the report stays as an uncommitted file in the worktree — the deliverable itself is complete.调研完成，报告已输出到 **`docs/pi-agent-report.md`**（在任务 worktree 内，测试与提交因权限被跳过）。 ## 核心发现 **Pi Agent 是什么**：Sinapsis 三种受管 Runtime 之一（`opencode` / `pi` / `claude-code`）。`pi` 是本机安装的 `@earendil-works/pi-coding-agent` CLI（`/opt/homebrew/bin/pi`）。 **实现方式**（`server/adapters/runtime/pi-runtime-adapter.ts`，260 行，零第三方依赖）： - **持久 RPC 进程模型** — 与其他两种 Runtime（短生命周期逐轮进程）不同，Pi 以 `pi --mode rpc` 启动常驻子进程，通过 LF 分隔 JSONL 通信。这是三种 Runtime 中唯一的长连接会话模型 - **RPC 协议**：`get_state`（获取 sessionId/sessionFile）→ `prompt`（空闲投递）/ `steer`（流式中追加）；恢复时 `switch_session` + 缓冲输入；`agent_settled` 是完成边界 - **事件翻译**：`message_update`→text、`tool_execution_start/end`→工具事件、`queue_update`→队列长度；未知事件静默留作 artifact（协议演进的缓冲） - **执行策略**：`read-only-no-tools` 会把参数整体替换为 `--no-tools --no-extensions --no-skills ... --no-approve`，用于频道只读对话 - **两条使用路径**：任务流（worktree + `task_sessions`）和对话流（`conversation_sessions` 持久化 + `switch_session` 恢复 + `session_lost` 冷启动兜底） **扩展点**（报告第 3 节，含优先级建议）： 1. **协议层**：`recordJson` 是唯一翻译点，新命令/事件在此扩展；端口已预留 `needs_input` 事件和 `timeout` 错误码但尚未使用 2. **执行策略**：在 `launch()` 的 args 分支加新枚举 → 新参数集 3. **新 Runtime 模板**：claude-code 的接入计划（`docs/superpowers/plans/2026-07-25-claude-code-runtime.md`）是完整工作示例 4. **最值得做的一步**：`task_sessions` 目前只存 `runtime_session_id` 不存 `sessionFile`，导致 Pi 任务在服务重启后无法 `switch_session` 恢复——补上即可与对话流对齐调研完成，报告已输出到 **`docs/pi-agent-report.md`**（在任务 worktree 内，测试与提交因权限被跳过）。 ## 核心发现 **Pi Agent 是什么**：Sinapsis 三种受管 Runtime 之一（`opencode` / `pi` / `claude-code`）。`pi` 是本机安装的 `@earendil-works/pi-coding-agent` CLI（`/opt/homebrew/bin/pi`）。 **实现方式**（`server/adapters/runtime/pi-runtime-adapter.ts`，260 行，零第三方依赖）： - **持久 RPC 进程模型** — 与其他两种 Runtime（短生命周期逐轮进程）不同，Pi 以 `pi --mode rpc` 启动常驻子进程，通过 LF 分隔 JSONL 通信。这是三种 Runtime 中唯一的长连接会话模型 - **RPC 协议**：`get_state`（获取 sessionId/sessionFile）→ `prompt`（空闲投递）/ `steer`（流式中追加）；恢复时 `switch_session` + 缓冲输入；`agent_settled` 是完成边界 - **事件翻译**：`message_update`→text、`tool_execution_start/end`→工具事件、`queue_update`→队列长度；未知事件静默留作 artifact（协议演进的缓冲） - **执行策略**：`read-only-no-tools` 会把参数整体替换为 `--no-tools --no-extensions --no-skills ... --no-approve`，用于频道只读对话 - **两条使用路径**：任务流（worktree + `task_sessions`）和对话流（`conversation_sessions` 持久化 + `switch_session` 恢复 + `session_lost` 冷启动兜底） **扩展点**（报告第 3 节，含优先级建议）： 1. **协议层**：`recordJson` 是唯一翻译点，新命令/事件在此扩展；端口已预留 `needs_input` 事件和 `timeout` 错误码但尚未使用 2. **执行策略**：在 `launch()` 的 args 分支加新枚举 → 新参数集 3. **新 Runtime 模板**：claude-code 的接入计划（`docs/superpowers/plans/2026-07-25-claude-code-runtime.md`）是完整工作示例 4. **最值得做的一步**：`task_sessions` 目前只存 `runtime_session_id` 不存 `sessionFile`，导致 Pi 任务在服务重启后无法 `switch_session` 恢复——补上即可与对话流对齐"
